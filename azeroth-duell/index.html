:root{
  color-scheme:dark;
  --gold:#ffd100; --gold2:#c9a227; --gold3:#7a5c12; --parch:#f3e3b8; --txt:#e9dcc0; --mut:#a8987a;
  --ink:#100b07; --stone:#241b13; --stone2:#33271b; --line:#6b5320;
  --ally:#2f7ee0; --horde:#c8372d; --hp:#33c24f; --bad:#ff5a4d;
  --disp:"Cinzel","Palatino Linotype","Book Antiqua",Georgia,serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#050302;color:var(--txt);font-family:var(--body);font-size:15px;line-height:1.35;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;position:relative;
  background:linear-gradient(#0006,#0000 30%,#0000 70%,#0007),var(--i-parch-dark) center/cover,var(--ink)}
#app.lite{background:radial-gradient(130% 90% at 50% 40%,#0000 55%,#3a1e0866),var(--i-parch-light) center/cover,#e0c88e}
h1,h2,h3{font-family:var(--disp);margin:0;font-weight:800;letter-spacing:.5px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
svg{display:block}
.mut{color:var(--mut)}

/* Rahmen im WoW-Stil */
.panel{background:linear-gradient(#2c2117,#1b140d);border:2px solid var(--gold3);border-radius:12px;
  box-shadow:inset 0 0 0 1px #000,inset 0 0 18px #0009,0 4px 12px #0008}
.btn{display:block;width:100%;font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:.5px;color:#fff3d6;text-align:center;
  border:16px solid transparent;border-image:var(--i-btn-red) 40 fill/16px/0 stretch;background:none;padding:3px 8px;
  text-shadow:0 2px 0 #000a,0 0 6px #0008;filter:drop-shadow(0 4px 4px #0009)}
.btn:active{border-image-source:var(--i-btn-press);transform:translateY(2px)}
.btn.prime{border-image-source:var(--i-btn-gold);color:#3a2206;text-shadow:0 1px 0 #fff8}
.btn.dark{border-image-source:var(--i-btn-press);font-size:inherit}
.btn.dark{font-size:19px}
.btn[disabled]{border-image-source:var(--i-btn-dis);opacity:.8;pointer-events:none}
.scr{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.scroll{flex:1;overflow-y:auto;padding:14px 14px 20px;display:flex;flex-direction:column;gap:12px}
.scroll>*{flex-shrink:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px 4px}
.top h2{flex:1;font-size:20px;color:var(--gold);text-shadow:0 2px 0 #000}
.ib{width:46px;height:46px;font-size:18px;display:grid;place-items:center;color:#fff3d6;text-shadow:0 1px 0 #000;border:12px solid transparent;border-image:var(--i-btn-sq) 30 fill/12px/0 stretch;background:none;filter:drop-shadow(0 2px 3px #0008)}
.ib:active{transform:translateY(2px)}

/* Titel */
.title{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:22px;text-align:center;position:relative;overflow:hidden}
.title .sky{position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 38%,#ffb02e55,transparent 70%);pointer-events:none}
.logo{font-family:var(--disp);font-weight:800;font-size:58px;line-height:.92;color:var(--gold);letter-spacing:2px;
  text-shadow:0 3px 0 #7a4a00,0 6px 0 #3a2000,0 0 28px #ff9d1c88;position:relative}
.logoimg{width:min(94%,430px);aspect-ratio:520/161;margin:0 auto;background:var(--i-logo) center/contain no-repeat;filter:drop-shadow(0 6px 10px #0008)}
.bnr{position:relative;margin:0 auto;background-position:center;background-size:contain;background-repeat:no-repeat;display:grid;place-items:center;filter:drop-shadow(0 6px 12px #000a)}
.bnr.win{width:min(78vw,320px);aspect-ratio:360/308;background-image:var(--i-win)}
.bnr.lose{width:min(70vw,290px);aspect-ratio:340/300;background-image:var(--i-lose)}
.bnr span{font-family:var(--disp);font-weight:800;letter-spacing:1px;position:absolute;left:12%;right:12%;text-align:center}
.bnr.win span{top:54%;line-height:1;transform:translateY(-50%);font-size:clamp(26px,9vw,40px);color:#4a2602;text-shadow:0 1px 0 #fff9,0 0 10px #ffe89a}
.bnr.lose span{top:54%;line-height:1;transform:translateY(-50%);font-size:clamp(17px,5.6vw,24px);color:#262626;text-shadow:0 1px 0 #ffffff77}
.tag{color:var(--parch);font-size:15px;opacity:.9}
.duo{display:flex;justify-content:center;align-items:flex-end;gap:0;margin:6px 0 4px;position:relative}
.duo .av{filter:drop-shadow(0 8px 10px #000a)}
.duo .vs{font-family:var(--disp);font-weight:800;font-size:26px;color:var(--gold);align-self:center;margin:0 6px;text-shadow:0 2px 0 #000}
.mote{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;background:#ffd27a;opacity:0;animation:mote 6s linear infinite;box-shadow:0 0 8px #ffb84d}
@keyframes mote{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-70vh) translateX(20px);opacity:0}}

/* Avatare */
.av{position:relative;display:block;flex:none;border-radius:50%;overflow:visible}
.av svg{width:100%;height:100%;border-radius:50%;border:3px solid var(--gold2);box-shadow:inset 0 0 0 2px #000,0 0 0 2px #000}
.av .cb{position:absolute;right:-4px;bottom:-4px;width:34%;height:34%;border-radius:50%;display:grid;place-items:center;font-style:normal;
  background:var(--c);border:2px solid #000;font-size:calc(var(--s)*.17);box-shadow:0 2px 4px #000a}
.mon{display:grid;place-items:center;border-radius:50%;flex:none;position:relative;
  background:radial-gradient(circle at 40% 30%,color-mix(in srgb,var(--g) 55%,#3a2c1c),#150f09 75%);border:3px solid var(--gold2);box-shadow:inset 0 0 0 2px #000,0 0 0 2px #000,0 0 18px color-mix(in srgb,var(--g) 50%,transparent)}
.mon.boss{border-color:#e8e8f0;box-shadow:inset 0 0 0 2px #000,0 0 0 2px #000,0 0 22px #ffd10099}
.mon span{filter:drop-shadow(0 4px 3px #000a);line-height:1}
.mon .mimg{position:absolute;inset:0;border-radius:50%;background:center/cover;filter:none}
.av .rimg{display:block;width:100%;height:100%;border-radius:50%;border:3px solid var(--gold2);box-shadow:inset 0 0 0 2px #000,0 0 0 2px #000;background:center/cover}
.pt .av .rimg{border:0;box-shadow:none}.hm .av .rimg{border:2px solid #ffd100;box-shadow:0 0 0 1px #000}
.cb.im,.ci.im{background-size:cover!important;background-position:center!important;background-repeat:no-repeat!important}
.order .o.im{background-size:cover;background-position:center}

/* Erstellung */
.steps{display:flex;gap:6px;padding:0 14px}
.steps i{flex:1;height:5px;border-radius:3px;background:#3a2d1e}
.steps i.on{background:var(--gold);box-shadow:0 0 8px #ffd10088}
.fact{font-family:var(--disp);font-weight:800;font-size:13px;letter-spacing:3px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.fact::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,currentColor,transparent);opacity:.6}
.fact.a{color:#5ea6ff}.fact.h{color:#ff6b5e}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px 8px;border-radius:12px;text-align:center;position:relative;
  background:linear-gradient(#2e2318,#1b140d);border:2px solid #4a3a1c;box-shadow:0 3px 0 #000}
.card b{font-family:var(--disp);font-size:12.5px;font-weight:800;color:var(--parch)}
.card small{font-size:10.5px;color:var(--mut);line-height:1.15}
.card.on{border-color:var(--gold);background:linear-gradient(#4a3716,#2a1f0e);box-shadow:0 0 0 2px #ffd10044,0 3px 0 #000,0 0 18px #ffd10055}
.card.off{opacity:.32;filter:grayscale(.7);pointer-events:none}
.card .ci{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:25px;background:var(--c);border:2px solid #000;box-shadow:inset 0 0 0 2px #fff3}
.infobox{padding:12px 14px;font-size:13.5px;line-height:1.4}
.infobox h3{font-size:17px;color:var(--gold);margin-bottom:4px}
.infobox .pas{margin-top:6px;color:#9fe08a}
.nm{width:100%;padding:12px;border-radius:10px;border:2px solid var(--gold3);background:#0e0905;color:var(--parch);font-family:var(--disp);font-size:18px;text-align:center;outline:none;-webkit-user-select:text;user-select:text}
.nm:focus{border-color:var(--gold)}
.hint{font-size:12.5px;color:var(--mut);text-align:center}

/* Symbole (Fähigkeiten) */
.ico{position:relative;width:var(--is,72px);height:var(--is,72px);border-radius:12px;display:grid;place-items:center;flex:none;touch-action:none;
  background:radial-gradient(circle at 35% 25%,color-mix(in srgb,var(--sc) 45%,#4a3a28),#150f09 85%);
  border:0;box-shadow:inset 0 0 14px color-mix(in srgb,var(--sc) 45%,transparent),0 3px 4px #0008}
.ico .gi{position:absolute;inset:0;border-radius:inherit;background:#0b0705 center/cover no-repeat}
.ico .cost,.ico .cd,.ico .lk{z-index:2}
.ico::before{content:"";z-index:1;position:absolute;inset:-6px;background:var(--fr,var(--i-fr-bronze)) center/100% 100% no-repeat;pointer-events:none;border-radius:inherit}
.ico .g{font-size:calc(var(--is,72px)*.5);line-height:1;filter:drop-shadow(0 2px 2px #000c)}
.ico:active:not(.dis){transform:translateY(2px);filter:brightness(1.25)}
.ico.racial{--fr:var(--i-fr-green)}
.ico .cost{position:absolute;right:-4px;bottom:-4px;min-width:22px;height:22px;padding:0 4px;border-radius:11px;background:var(--rc,#3b8cff);border:2px solid #000;color:#fff;font:700 12px/18px var(--body);text-align:center;text-shadow:0 1px 1px #000}
.ico .cd{position:absolute;inset:0;border-radius:9px;background:#000b;display:grid;place-items:center;font:800 26px var(--disp);color:#fff;text-shadow:0 2px 3px #000}
.ico .lk{position:absolute;inset:0;border-radius:9px;z-index:1;background:#000c;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;gap:0}
.ico .lk small{font:700 10px var(--body);color:#ffd100;text-shadow:0 1px 2px #000}
.ico.nr{filter:saturate(.3) brightness(.7)}
.ico.nr .cost{background:#7a1c14}
.ico.hold{transform:scale(.94)}
.ico.empty{background:#120c07;border:2px dashed #7a5a2a;box-shadow:none}.ico.empty::before{display:none}
.ico.sel{box-shadow:0 0 14px #ffd100aa}

/* Tooltip */
#tip{position:fixed;z-index:60;pointer-events:none;width:min(320px,calc(100vw - 16px));opacity:0;transition:opacity .08s;color:#2a1608;
  border-style:solid;border-color:transparent;border-width:30px 22px;border-image:var(--i-scroll) 100 70 fill/30px 22px stretch;
  filter:drop-shadow(0 8px 14px #000c);font-size:13px;line-height:1.35}
#tip.on{opacity:1}
#tip .tn{font-family:var(--disp);font-weight:800;font-size:16px;color:#2a1608;margin-bottom:1px}
#tip .tl{display:flex;justify-content:space-between;gap:10px;color:#3a2410}
#tip .tl i{font-style:normal;color:#6a4f2e}
#tip .td{margin-top:6px;color:#7a1f12}
#tip .td.w{color:#2a1608}
#tip .tg{color:#2a6a1a}.tb{color:#a3201a}
#tip .tf{margin-top:6px;color:#6a4f2e;font-style:italic;font-size:12px}

/* Lager */
.hero{display:flex;gap:12px;align-items:center;padding:12px}
.hero .hi{flex:1;min-width:0}
.hero h2{font-size:21px;color:var(--parch);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .sub{font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:12.5px;margin-top:5px}
.stats b{color:var(--parch)}
.xp{height:6px;border-radius:3px;background:#0008;margin-top:6px;overflow:hidden;border:1px solid #000}
.xp i{display:block;height:100%;background:linear-gradient(#b27cff,#7b4ad8)}
.row{display:flex;gap:10px;align-items:center}
.slots{display:flex;gap:10px;justify-content:space-around;padding:10px 6px}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--mut);width:31%;text-align:center}
.slot .sn{font-size:11.5px;line-height:1.2;font-weight:600;min-height:28px}
.slot small{font-size:10.5px;color:var(--gold2)}
.slot:active .ico{transform:translateY(2px)}
.irow{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:linear-gradient(#2e2318,#1b140d);border:2px solid #4a3a1c}
.irow.on{border-color:var(--gold);box-shadow:0 0 14px #ffd10044}
.irow .ii{flex:1;min-width:0;font-size:12px;line-height:1.3}
.irow .ii b{font-family:var(--disp);font-size:13.5px;display:block}
.irow .ii small{display:block;color:var(--mut)}
.irow .ii .tg{color:#7fe36a}.irow .up{color:#7fe36a;font-weight:700}.irow .dn{color:#ff7a6e;font-weight:700}
.irow .bt2{display:flex;flex-direction:column;gap:6px}
.irow .ib{width:auto;min-width:46px;padding:0 4px;font-size:13px;font-weight:700;height:46px}
.cmp{display:flex;gap:14px;justify-content:center;font-size:13px;padding:8px}
.item{--is:62px}
.item.r0{--fr:var(--i-fr-r0)}.item.r1{--fr:var(--i-fr-r1)}.item.r2{--fr:var(--i-fr-r2)}.item.r3{--fr:var(--i-fr-r3)}.item.r4{--fr:var(--i-fr-r0)}
.item.r4::before{filter:sepia(1) saturate(7) hue-rotate(-18deg) brightness(1.05) drop-shadow(0 0 6px #ff8000)}
.abrow{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;padding:10px 6px;--is:56px}
.sec{font-family:var(--disp);font-weight:800;font-size:12px;letter-spacing:3px;color:var(--gold2);text-transform:uppercase;margin:2px 2px -4px}
.foe{display:flex;gap:12px;align-items:center;padding:12px;position:relative}
.foe .fi{flex:1;min-width:0}
.foe h3{font-size:19px;color:#ffb0a6}
.foe .ty{display:inline-block;font:700 10px var(--body);letter-spacing:1.5px;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:#3a2b1b;color:var(--gold);margin-bottom:3px}
.foe .ty.boss{background:#ffd100;color:#2a1a02}
.zone{font-size:12px;color:var(--mut)}

/* Kampf */
.bt{display:flex;flex-direction:column;flex:1;min-height:0}
.bhd{display:flex;align-items:center;gap:8px;padding:8px 10px 4px}
.bhd .t{flex:1;text-align:center;min-width:0}
.bhd .t b{font-family:var(--disp);font-size:15px;color:var(--gold);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bhd .t small{color:var(--mut);font-size:11.5px}
.bhd .ib{width:42px;height:42px;font-size:15px}
.order{display:flex;gap:5px;align-items:center;justify-content:center;padding:2px 10px 6px;min-height:34px}
.order .o{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-size:13px;border:2px solid;background:#150f09;transition:all .2s}
.order .o.p{border-color:var(--ally)}.order .o.e{border-color:var(--horde)}
.order .o:first-child{width:31px;height:31px;font-size:16px;box-shadow:0 0 10px currentColor}
.order small{color:var(--mut);font-size:10px;margin-right:4px}
.arena{flex:1;min-height:0;margin:0 8px;border-radius:16px;position:relative;overflow:hidden;border:2px solid var(--gold3);box-shadow:0 0 0 1px #000,inset 0 0 40px #000a}
.arena::after{content:"";position:absolute;inset:0;background:linear-gradient(#0006,#0000 22%,#0000 58%,#0007);pointer-events:none;z-index:0}
.u{position:absolute;display:flex;flex-direction:column;z-index:1}
.u.e{top:8px;left:8px;right:8px;align-items:center}
.u.p{bottom:30px;left:8px;right:8px;align-items:center}
.u .fig{position:relative;flex:none;transition:filter .2s}
.u.act .plate{filter:drop-shadow(0 0 9px #ffd100cc) drop-shadow(0 3px 5px #000a)}
.pt{position:absolute;left:2.6%;top:50.3%;width:20%;aspect-ratio:1;transform:translateY(-50%)}
.pt .fig{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;transform:translateZ(0)}
.pt>.cb{position:absolute;right:-5%;bottom:-5%;width:34%;height:34%;border-radius:50%;display:grid;place-items:center;font-style:normal;background:var(--c);border:2px solid #000;font-size:calc(var(--s)*.17);box-shadow:0 2px 4px #000a;z-index:2}
.pt .av,.pt .mon{width:100%!important;height:100%!important}
.pt .av svg{border:0;box-shadow:none}.pt .mon{border:0;box-shadow:none}
.u.dead .pt .fig{filter:grayscale(1) brightness(.45);transition:filter .6s}
.plate{position:relative;width:min(100%,380px);aspect-ratio:621/154;flex:none;background:var(--i-plate) center/100% 100% no-repeat;filter:drop-shadow(0 3px 5px #000a);touch-action:none}
.sl{position:absolute;overflow:hidden;border-radius:4px}
.sl1{left:27%;width:54.4%;top:23.4%;height:28%}
.sl2{left:27%;width:54.4%;top:65.6%;height:13.4%;border-radius:3px}
.sl i{position:absolute;left:0;top:0;bottom:0;width:100%;transition:width .35s;background:linear-gradient(#7cec8e,#27a63f 55%,#167a2a);box-shadow:inset 0 1px 0 #fff7}
.sl i.m{background:linear-gradient(#ffe07a,#e0a21a 55%,#a8730c)}.sl i.l{background:linear-gradient(#ff9a8c,#dc3326 55%,#a01c12)}
.sl2 i{transition:width .25s;box-shadow:inset 0 1px 0 #fff6}
.sl .sh{position:absolute;left:0;top:0;bottom:0;background:#ffffffb0;mix-blend-mode:overlay;transition:width .3s}
.sl1 .nn{position:absolute;left:7px;top:50%;transform:translateY(-50%);font:800 clamp(10px,3.3vw,13px)/1 var(--disp);color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u.e .sl1 .nn{color:#ffd9d2}
.sl1 b{position:absolute;right:6px;top:50%;transform:translateY(-50%);font:700 10.5px/1 var(--body);color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000}
.sl2 b{position:absolute;inset:0;text-align:center;font:700 8.5px/100% var(--body);color:#fff;text-shadow:0 1px 2px #000,0 0 2px #000;display:grid;place-items:center}
.lvl{position:absolute;left:85.6%;width:10.6%;top:15%;height:42%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;color:#ffd100;text-shadow:0 1px 2px #000;line-height:1}
.lvl small{font:700 7px var(--body);color:#e8d8a8;letter-spacing:.5px;margin-bottom:1px}
.lvl span{font-size:clamp(14px,4.4vw,18px)}
.sts{position:absolute;left:24%;top:100%;margin-top:3px;display:flex;gap:3px;min-height:22px;flex-wrap:wrap;max-width:100%}
.sti{position:relative;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-size:13px;background:#1a120a;border:2px solid #2f9b3b;touch-action:none}
.sti.bad{border-color:#c33a2c}
.sti i{position:absolute;right:-3px;bottom:-5px;font:700 9px var(--body);font-style:normal;color:#fff;text-shadow:0 1px 1px #000,0 0 2px #000}
.fxl{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.fl{position:absolute;font-family:var(--disp);font-weight:800;font-size:26px;transform:translate(-50%,-50%);text-shadow:0 2px 0 #000,0 0 6px #000,0 0 3px #000;white-space:nowrap}
.fl.crit{font-size:36px}
.fl.sm{font-size:16px;font-family:var(--body);letter-spacing:.3px}
.proj{position:absolute;font-size:30px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 8px var(--c))}
.log{margin:6px 8px 0;padding:6px 10px;border-radius:10px;min-height:44px;background:#0b0704cc;border:1px solid #4a3a1c;font-size:13px;color:var(--parch);display:flex;align-items:center;justify-content:center;text-align:center}
.actbar{padding:8px 8px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#1a130c,#0b0704);border-top:2px solid var(--gold3);border-radius:16px 16px 0 0;margin-top:6px;box-shadow:0 -6px 16px #000a}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:9px 6px;max-width:372px;margin:0 auto;justify-items:center;--is:min(18.5vw,80px)}
.ico.pot{--fr:var(--i-fr-red)}
.ico.pass{--fr:var(--i-fr-bronze)}
.acts.lock{opacity:.7}
.hintbar{text-align:center;font-size:11.5px;color:var(--mut);margin-bottom:6px}

/* Ergebnis */
.ovl{position:absolute;inset:0;z-index:30;background:#000c;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:20px;text-align:center;animation:fade .35s}
@keyframes fade{from{opacity:0}}
.ovl h1{font-size:50px;color:var(--gold);text-shadow:0 3px 0 #7a4a00,0 0 30px #ffb02e88}
.ovl h1.lose{color:#9a9186;text-shadow:0 3px 0 #000}
.ovl .box{width:100%;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center}
.ovl .lv{font-family:var(--disp);font-weight:800;color:#b98cff;font-size:20px}
.ovl .rw{display:flex;gap:12px;align-items:center;text-align:left}
.ovl .rw .item{--is:64px}
.ovl .rw b{display:block;font-family:var(--disp)}
.r0t{color:#e6e6e6}.r1t{color:#1eff00}.r2t{color:#4aa8ff}.r3t{color:#c36bff}.r4t{color:#ff8000}
.new{color:var(--gold);font-weight:700;font-size:13.5px}
.ovl .box.scb{padding:10px 6px;width:100%;max-width:370px;background:none;border-style:solid;border-color:transparent;border-width:30px 22px;border-image:var(--i-scroll) 100 70 fill/30px 22px stretch;box-shadow:none;filter:drop-shadow(0 6px 12px #000c);color:#2a1608}
.ink .lv{color:#5a1f9a}.ink .new{color:#7a1f12}.ink .mut{color:#6a4f2e}
.ink .r0t{color:#555}.ink .r1t{color:#1a7a10}.ink .r2t{color:#0a55b8}.ink .r3t{color:#7a2cb8}.ink .r4t{color:#c25e00}
.newab{display:flex;gap:14px;align-items:center;text-align:left;--is:58px;padding:4px 6px;width:100%}

function itemVal(lvl,rar){return Math.round((2+lvl*.8)*[1,1.35,1.8,2.5,3.3][rar])}
function itemBonus(it){
  if(!it)return{};
  const v=it.v;
  if(it.slot==='w')return{ap:v};
  if(it.slot==='a')return{hp:v*5,arm:v*1.5};
  return{crit:Math.min(it.rar===4?.18:.12,v*.0035),mres:v*1.5};
}
function itemText(it){
  const b=itemBonus(it),o=[];
  if(b.ap)o.push(`+${Math.round(b.ap)} Angriffskraft`);
  if(b.hp)o.push(`+${Math.round(b.hp)} Leben`);
  if(b.arm)o.push(`+${Math.round(b.arm)} Rüstung`);
  if(b.crit)o.push(`+${(b.crit*100).toFixed(1)} % Kritische Treffer`);
  if(b.mres)o.push(`+${Math.round(b.mres)} Magiewiderstand`);
  return o;
}
let UID=0;
function mkUnit(o){
  const lvl=o.lvl,t=o.tm,R=o.race?RACES[o.race]:{},sc=o.sc||1;
  const u={uid:++UID,name:o.name,lvl,player:!!o.player,race:o.race,cls:o.cls,ic:o.ic,boss:!!o.boss,mon:o.mon||null,col:o.col,
    weak:o.weak,resist:o.resist,
    hpMax:(70+18*lvl)*t.hp*(R.hp||1)*sc,ap:(12+4*lvl)*t.ap*(R.ap||1)*sc,
    arm:(10+4*lvl)*t.arm*(R.arm||1),mres:(10+5*lvl)*t.res*(R.res||1),
    crit:.08+(R.crit||0),dodge:.05+(R.dodge||0),spd:t.spd+(R.spd||0),regen:R.regen||0,
    ini:rnd(0,40),st:[],cds:{},sdr:0,potions:o.player?2:0,abs:o.abs,rk:o.rk};
  for(const it of Object.values(o.eq||{})){const b=itemBonus(it);u.ap+=b.ap||0;u.hpMax+=b.hp||0;u.arm+=b.arm||0;u.crit+=b.crit||0;u.mres+=b.mres||0}
  u.hpMax=Math.round(u.hpMax);u.hp=u.hpMax;u.ap=Math.round(u.ap*10)/10;
  u.rv=RES[u.rk].start;
  return u;
}
function classUnit(o){
  const C=CLASSES[o.cls],R=RACES[o.race];
  return mkUnit({...o,tm:{hp:C.hp,ap:C.ap,arm:C.arm,res:C.res,spd:C.spd},ic:C.ic,col:C.col,rk:C.rk,
    abs:[...C.ab.filter((_,i)=>o.lvl>=UNLOCK[i]||!o.player),R.ab?'r_'+R.ab:null].filter(Boolean)});
}
function heroUnit(S){
  return classUnit({name:S.name,lvl:S.lvl,player:true,race:S.race,cls:S.cls,eq:S.eq});
}
function mkMon(d,lvl,o={}){
  const u=mkUnit({name:o.n||d.n,lvl,tm:{hp:d.hp*(o.hp||1),ap:d.ap*(o.ap||1),arm:d.arm,res:d.res,spd:d.spd},ic:o.ic||d.ic,col:d.c,mon:true,boss:!!o.boss,
    weak:d.weak,resist:d.resist,sc:o.sc||.86,abs:d.mv,rk:'energy'});
  u.rv=0;u.title=o.title||'Monster';u.quote=o.n?null:d.q;return u;

const xpNeed=l=>60+40*l;

function fightXp(elvl,lvl,kind){

/* ================================================================
   KAMPF-ENGINE
================================================================ */
const eff=(u,k)=>{let v=0;for(const s of u.st)if(s.m&&s.m[k])v+=s.m[k];return v};
const spdOf=u=>Math.max(2,u.spd*(1+eff(u,'spd')));
function newBattle(p,e){return{p,e,turns:0,over:false,winner:null,units:[p,e]}}
function nextUnit(B){
  for(;;){
    for(const u of B.units)u.ini+=spdOf(u);
    const c=B.units.filter(u=>u.ini>=100).sort((a,b)=>b.ini-a.ini);
    if(c.length){c[0].ini-=100;return c[0]}
  }
}
function previewOrder(B,n=7){
  const sv=B.units.map(u=>u.ini),out=[];
  for(let i=0;i<n;i++)out.push(nextUnit(B));
  B.units.forEach((u,i)=>u.ini=sv[i]);return out;
}
const usable=(u,id)=>{const a=A[id];return a&&(u.cds[id]||0)<=0&&u.rv>=a.cost};
const foeOf=(B,u)=>u===B.p?B.e:B.p;

function addStatus(u,s,self){
  const t=s.t+(self?1:0);
  const n={...s,t};
  u.st=u.st.filter(x=>x.id!==s.id);u.st.push(n);return n;
}
function gainRes(u,v){u.rv=Math.min(100,u.rv+v)}
function hurt(B,src,tgt,amt,evs,o={}){
  amt=Math.max(1,Math.round(amt));let absorbed=0;
  for(const s of tgt.st){if(s.sh>0&&amt>0){const a=Math.min(s.sh,amt);s.sh-=a;amt-=a;absorbed+=a}}
  tgt.st=tgt.st.filter(s=>!(s.isShield&&s.sh<=0));
  tgt.hp=Math.max(0,tgt.hp-amt);
  if(tgt.rk==='rage')gainRes(tgt,amt>0?10:0);
  if(src&&src!==tgt&&src.rk==='rage'&&amt>0)gainRes(src,8);
  evs.push({t:'hit',src,tgt,amt,abs:absorbed,crit:!!o.crit,sc:o.sc,dot:!!o.dot,hp:tgt.hp});
  if(tgt.hp<=0&&!B.over){B.over=true;B.winner=tgt===B.p?B.e:B.p;evs.push({t:'end',winner:B.winner})}
  return amt;
}
function calc(B,src,tgt,sc,p,o){
  let raw=src.ap*p*rnd(.92,1.08);
  raw*=1+eff(src,'out');
  raw*=Math.max(.15,1+eff(tgt,'inn'));
  const red=sc==='phys'?tgt.arm/(tgt.arm+40+12*tgt.lvl):tgt.mres/(tgt.mres+50+14*tgt.lvl);
  raw*=1-Math.min(.7,red);
  if(tgt.weak===sc)raw*=1.3;
  if(tgt.resist===sc)raw*=.7;
  if(o&&o.ex&&tgt.hp<=tgt.hpMax*.3)raw*=1+o.ex;
  if(B.turns>40)raw*=1+.08*(B.turns-40);
  return raw;
}
function strike(B,src,tgt,sc,f,evs){
  const dodge=Math.min(.75,tgt.dodge+eff(tgt,'dodge'));
  if(sc==='phys'&&Math.random()<dodge){evs.push({t:'miss',tgt});return 0}
  let raw=calc(B,src,tgt,sc,f.p,f);
  const cc=src.crit+eff(src,'crit')+(f.crit||0),crit=Math.random()<cc;
  if(crit)raw*=1.6;
  return hurt(B,src,tgt,raw,evs,{crit,sc});
}
function healUnit(u,amt,evs){
  amt=Math.round(Math.min(amt,u.hpMax-u.hp));u.hp+=amt;
  evs.push({t:'heal',tgt:u,amt,hp:u.hp});return amt;
}
function beginTurn(B,u){
  const evs=[];B.turns++;
  u.rv=Math.min(100,u.rv+RES[u.rk].reg);
  if(u.regen)healUnit(u,u.hpMax*u.regen,evs);
  for(const s of [...u.st]){
    if(s.hot)healUnit(u,s.hot,evs);
    if(s.dot&&!B.over){
      const red=s.sc==='phys'?u.arm/(u.arm+40+12*u.lvl):u.mres/(u.mres+50+14*u.lvl);
      let raw=s.dot*(1-Math.min(.7,red))*Math.max(.15,1+eff(u,'inn'))*rnd(.95,1.05);
      if(u.weak===s.sc)raw*=1.3;if(u.resist===s.sc)raw*=.7;
      hurt(B,s.by,u,raw,evs,{sc:s.sc,dot:true});
    }
  }
  evs.push({t:'sync'});
  return evs;
}
const isStunned=u=>u.st.some(s=>s.stun);
function endTurn(B,u){
  const evs=[];
  for(const s of u.st)s.t--;
  u.st=u.st.filter(s=>s.t>0&&!(s.isShield&&s.sh<=0));
  for(const k in u.cds)if(u.cds[k]>0)u.cds[k]--;
  if(u.sdr>0)u.sdr--;
  evs.push({t:'sync'});return evs;
}
function perform(B,u,act){
  const evs=[],foe=foeOf(B,u);
  if(act.potion){
    u.potions--;evs.push({t:'log',m:`${u.name} trinkt einen Heiltrank.`});
    evs.push({t:'cast',src:u,ab:{n:'Heiltrank',ic:'🧪',s:'holy',fx:[{k:'heal'}]}});
    healUnit(u,u.hpMax*.4,evs);evs.push({t:'sync'});return evs;
  }
  if(act.pass){evs.push({t:'log',m:`${u.name} wartet ab.`});gainRes(u,u.rk==='mana'?10:0);return evs}
  const a=A[act.ab];
  u.rv-=a.cost;u.cds[a.id]=a.cd?a.cd+1:0;
  evs.push({t:'log',m:`${u.name} wirkt ${a.n}.`});
  evs.push({t:'cast',src:u,ab:a});
  let dealt=0;
  for(const f of a.fx){
    if(B.over)break;
    switch(f.k){
      case 'dmg':for(let i=0;i<(f.hits||1)&&!B.over;i++)dealt+=strike(B,u,foe,a.s,f,evs);break;
      case 'gain':gainRes(u,f.v);break;
      case 'life':if(dealt>0)healUnit(u,dealt*f.f,evs);break;
      case 'heal':healUnit(u,u.ap*f.p*rnd(.95,1.05),evs);break;
      case 'hot':{addStatus(u,{id:f.id,n:f.n,ic:f.ic,t:f.t,hot:u.ap*f.p,good:true},true);evs.push({t:'st',tgt:u,n:f.n,good:true});break}
      case 'shield':{addStatus(u,{id:f.id,n:f.n,ic:f.ic,t:f.t,sh:u.ap*f.p,isShield:true,good:true},true);evs.push({t:'st',tgt:u,n:f.n,good:true});break}
      case 'cleanse':{u.st=u.st.filter(s=>s.good||s.stun);evs.push({t:'st',tgt:u,n:'Gereinigt',good:true});break}
      case 'st':{const self=f.w==='self',tg=self?u:foe;
        addStatus(tg,{id:f.id,n:f.n,ic:f.ic,t:f.t,m:f.m,good:self},self);evs.push({t:'st',tgt:tg,n:f.n,good:self});break}
      case 'dot':addStatus(foe,{id:f.id,n:f.n,ic:f.ic,t:f.t,dot:u.ap*f.p*(1+eff(u,'out')),sc:a.s,by:u,good:false},false);evs.push({t:'st',tgt:foe,n:f.n,good:false});break;
      case 'stun':
        if(foe.sdr>0||isStunned(foe)){evs.push({t:'st',tgt:foe,n:'Widersteht',good:false})}
        else{addStatus(foe,{id:'stun',n:'Betäubt',ic:'💫',t:f.t,stun:true,good:false},false);foe.sdr=3;evs.push({t:'st',tgt:foe,n:'Betäubt!',good:false})}
        break;
    }
  }
  evs.push({t:'sync'});return evs;
}
function aiPick(B,u){
  const foe=foeOf(B,u);
  if(u.player&&u.potions>0&&u.hp<u.hpMax*.33&&Math.random()<.85)return{potion:true};
  const has=(t,id)=>t.st.some(s=>s.id===id),opts=[];
  for(const id of u.abs){
    if(!usable(u,id))continue;
    const a=A[id];let w=1;
    for(const f of a.fx){
      const r=u.hp/u.hpMax;
      if(f.k==='heal'||f.k==='hot'){w*=r<.45?5:r<.7?1.2:.04;if(f.k==='hot'&&has(u,f.id))w=0}
      else if(f.k==='st'){if(has(f.w==='self'?u:foe,f.id))w=0;else if(f.w==='self'&&f.m&&f.m.inn&&r>.8)w*=.6}
      else if(f.k==='stun'){if(foe.sdr>0||isStunned(foe))w=0;else w*=1.5}
      else if(f.k==='dot'){if(has(foe,f.id))w=0}
      else if(f.k==='shield'){if(u.st.some(s=>s.isShield))w=0}
      else if(f.k==='cleanse'){if(!u.st.some(s=>!s.good&&!s.stun))w*=.05}
      else if(f.k==='dmg'&&f.ex&&foe.hp<=foe.hpMax*.3)w*=4;
    }
    if(a.cost>0)w*=1+a.cost/40;
    opts.push([id,w]);
  }
  const tot=opts.reduce((s,o)=>s+o[1],0);
  if(!opts.length||tot<=0){const f=u.abs.find(id=>usable(u,id));return f?{ab:f}:{pass:true}}
  let r=Math.random()*tot;
  for(const[id,w]of opts){r-=w;if(r<=0)return{ab:id}}
  return{ab:opts[opts.length-1][0]};
}

/* ----- Beschreibungen ----- */
function abDesc(u,a){
  const L=[];
  const out=1+eff(u,'out');
  for(const f of a.fx){
    switch(f.k){
      case 'dmg':{const v=Math.round(u.ap*f.p*out);
        L.push(f.hits>1?`Trifft ${f.hits}× und verursacht jeweils ca. <b>${v}</b> ${a.s==='phys'?'physischen ':SCHN[a.s]+'-'}Schaden.`:`Verursacht ca. <b>${v}</b> ${a.s==='phys'?'physischen ':SCHN[a.s]+'-'}Schaden.`);
        if(f.ex)L.push(`Gegner unter 30 % Leben: <b>+${pct(f.ex)} %</b> Schaden.`);
        if(f.crit)L.push(`+${pct(f.crit)} % Chance auf kritischen Treffer.`);break}
      case 'dot':L.push(`Verursacht ${f.t} Züge lang je ca. <b>${Math.round(u.ap*f.p*out)}</b> ${a.s==='phys'?'physischen ':SCHN[a.s]+'-'}Schaden pro Zug.`);break;
      case 'heal':L.push(`Heilt dich um ca. <b>${Math.round(u.ap*f.p)}</b> Leben.`);break;
      case 'hot':L.push(`Heilt dich ${f.t} Züge lang um ca. <b>${Math.round(u.ap*f.p)}</b> Leben pro Zug.`);break;
      case 'shield':L.push(`Absorbiert die nächsten <b>${Math.round(u.ap*f.p)}</b> Schaden (${f.t} Züge).`);break;
      case 'stun':L.push(`<b>Betäubt</b> das Ziel für ${f.t} Zug. Danach 2 Züge immun.`);break;
      case 'cleanse':L.push(`Entfernt alle schädlichen Effekte von dir.`);break;
      case 'life':L.push(`Du heilst dich um <b>${pct(f.f)} %</b> des verursachten Schadens.`);break;
      case 'gain':L.push(`Gewährt <b>${f.v}</b> ${RES[u.rk].n}.`);break;
      case 'st':{const m=f.m,p=[];
        if(m.out)p.push(`${m.out>0?'+':'−'}${pct(Math.abs(m.out))} % verursachter Schaden`);
        if(m.inn)p.push(`${m.inn<0?'−':'+'}${pct(Math.abs(m.inn))} % erlittener Schaden`);
        if(m.dodge)p.push(`+${pct(m.dodge)} % Ausweichen (physisch)`);
        if(m.spd)p.push(`${m.spd>0?'+':'−'}${pct(Math.abs(m.spd))} % Tempo`);
        if(m.crit)p.push(`+${pct(m.crit)} % Kritisch`);
        L.push(`${f.w==='self'?'Du erhältst':'Ziel erhält'} <b>${f.n}</b>: ${p.join(', ')} (${f.t} Züge).`);break}
    }
  }
  return L;
}
function abTip(u,id,opts={}){
  const a=A[id];if(!a)return'';
  const racial=id.startsWith('r_'),mon=id.startsWith('m_');
  const rs=RES[u.rk];
  const cost=a.cost?`${a.cost} ${rs.n}`:'Kostenlos';
  const cd=a.cd?`${a.cd} ${a.cd===1?'Zug':'Züge'} Abklingzeit`:'Sofort wirkbar';
  let h=`<div class="tn" style="color:${racial?'#2a6a1a':'#2a1608'}">${a.ic} ${a.n}</div>`;
  h+=`<div class="tl"><span>${cost}</span><i>${cd}</i></div>`;
  h+=`<div class="tl"><span style="color:${SCHD[a.s]}">${SCH[a.s][0]}</span><i>${racial?'Völkerfähigkeit':mon?'':'Klassenfähigkeit'}</i></div>`;
  for(const l of abDesc(u,a))h+=`<div class="td w">${l}</div>`;
  if(opts.lock)h+=`<div class="td tb">Wird auf Stufe ${opts.lock} freigeschaltet.</div>`;
  else if(opts.cd>0)h+=`<div class="td tb">Noch ${opts.cd} Züge Abklingzeit.</div>`;
  else if(opts.poor)h+=`<div class="td tb">Nicht genug ${rs.n}.</div>`;
  return h;
}
function stTip(s){
  const L=[];
  if(s.stun)L.push('Kann nicht handeln.');
  if(s.dot)L.push(`Erleidet ca. ${Math.round(s.dot)} ${s.sc==='phys'?'physischen ':SCHN[s.sc]+'-'}Schaden pro Zug.`);
  if(s.hot)L.push(`Heilt ca. ${Math.round(s.hot)} Leben pro Zug.`);
  if(s.isShield)L.push(`Absorbiert noch ${Math.round(s.sh)} Schaden.`);
  const m=s.m||{};
  if(m.out)L.push(`${m.out>0?'+':'−'}${pct(Math.abs(m.out))} % verursachter Schaden`);
  if(m.inn)L.push(`${m.inn<0?'−':'+'}${pct(Math.abs(m.inn))} % erlittener Schaden`);
  if(m.dodge)L.push(`+${pct(m.dodge)} % Ausweichen`);
  if(m.spd)L.push(`${m.spd>0?'+':'−'}${pct(Math.abs(m.spd))} % Tempo`);
  return`<div class="tn" style="color:${s.good?'#2a6a1a':'#a3201a'}">${s.ic} ${s.n}</div>`+L.map(l=>`<div class="td w">${l}</div>`).join('')+`<div class="tf">Noch ${s.t} Züge</div>`;
}

let AC=null;
function tone(f,d,type='sine',v=.08,to=null,delay=0){
  if(!soundOn)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
const MUS={el:null,name:null,want:null};
function mFade(a,to,done){const st=a.volume,t0=performance.now();(function f(){const k=Math.min(1,(performance.now()-t0)/500);try{a.volume=st+(to-st)*k}catch(e){}if(k<1)requestAnimationFrame(f);else done&&done()})()}
function music(name){
  MUS.want=name;
  if(!soundOn||!name){if(MUS.el){const o=MUS.el;MUS.el=null;mFade(o,0,()=>o.pause())}MUS.name=null;return}
  if(MUS.name===name&&MUS.el&&!MUS.el.paused)return;
  if(MUS.el){const o=MUS.el;mFade(o,0,()=>o.pause())}
  try{
    const a=new Audio('audio/'+name+'.m4a');a.loop=true;a.volume=0;MUS.el=a;MUS.name=name;
    const pr=a.play();if(pr&&pr.then)pr.then(()=>mFade(a,.3)).catch(()=>{if(MUS.el===a){MUS.el=null;MUS.name=null}});
  }catch(e){MUS.el=null;MUS.name=null}
}
document.addEventListener('pointerdown',()=>{if(MUS.want&&!MUS.name)music(MUS.want)});
document.addEventListener('visibilitychange',()=>{if(MUS.el){if(document.hidden)MUS.el.pause();else if(soundOn)MUS.el.play().catch(()=>{})}});

const tipEl=document.getElementById('tip');

function showTip(html,el){
  tipEl.innerHTML=html;tipEl.classList.add('on');
  const r=el.getBoundingClientRect(),tw=tipEl.offsetWidth,th=tipEl.offsetHeight;
  let x=r.left+r.width/2-tw/2;x=Math.max(8,Math.min(innerWidth-tw-8,x));
  let y=r.top-th-10;if(y<8)y=Math.min(innerHeight-th-8,r.bottom+10);
  tipEl.style.left=x+'px';tipEl.style.top=y+'px';tipShown=true;
}
function hideTip(){tipEl.classList.remove('on');tipShown=false}
function resolveTip(el){
  const k=el.dataset.tip;if(!k)return null;
  const [type,a,b]=k.split(':');
  switch(type){
    case 'ab':{ // Kampf: Fähigkeit des Spielers
      const u=B?B.p:hero,id=a,def=A[id];
      const slotIdx=u.abs.indexOf(id);
      const cd=u.cds[id]||0,poor=u.rv<def.cost;
      return abTip(u,id,{cd,poor:!cd&&poor});
    }
    case 'pv':{ // Vorschau im Lager/Erstellung
      const u=hero,id=a,i=CLASSES[S.cls].ab.indexOf(id);
      return abTip(u,id,{lock:i>=0&&hero.lvl<UNLOCK[i]?UNLOCK[i]:0});
    }
    case 'cr':{ // Erstellung: Fähigkeit einer Klasse
      const c=CLASSES[CR.cls],u=classUnit({name:'',lvl:1,player:false,race:CR.race||'mensch',cls:CR.cls});
      const i=c.ab.indexOf(a);u.lvl=1;
      return abTip(u,a,{lock:i>=0&&UNLOCK[i]>1?UNLOCK[i]:0});
    }
    case 'pot':return`<div class="tn">🧪 Heiltrank</div>${S.pots?`<div class="td tg">Dazu ${Math.min(S.pots,3)} gekaufte Tränke aus deinem Vorrat (${S.pots}).</div>`:''}<div class="tl"><span>Gegenstand</span><i>Verbraucht deinen Zug</i></div><div class="td w">Stellt <b>40 %</b> deines maximalen Lebens wieder her.</div><div class="tf">Pro Kampf ${B?B.p.potions:2} übrig.</div>`;
    case 'pass':return`<div class="tn">⏳ Abwarten</div><div class="td w">Du überspringst deinen Zug${B&&B.p.rk==='mana'?' und erhältst 10 Mana':''}.</div>`;
    case 'loot':return LOOT?itemTip(LOOT):null;
    case 'it':{const it=[...Object.values(S.eq),...S.bag,...((S.shop&&S.shop.items)||[])].find(x=>x&&x.id===a);return it?itemTip(it):null}
    case 'item':{const it=S.eq[a];return it?itemTip(it):`<div class="tn mut">Leerer Platz</div><div class="td w">Besiege Gegner, um Beute zu erhalten.</div>`}
    case 'st':{const u=a==='p'?B.p:B.e,s=u.st.find(x=>x.id===b);return s?stTip(s):null}

  }

}

let hoverEl=null,pressMouse=false;
const tipGo=el=>{const h=resolveTip(el);if(h){showTip(h,el);return true}return false};
// Maus: Details erscheinen beim Darüberfahren
document.addEventListener('pointerover',e=>{
  if(e.pointerType!=='mouse')return;
  const el=e.target.closest('[data-tip]');
  if(el===hoverEl)return;
  hoverEl=el;
  if(el)tipGo(el);else if(!pressEl)hideTip();
});

// Finger: Details beim Gedrückthalten
document.addEventListener('pointerdown',e=>{
  suppressClick=false;

  if(pressMouse)return;

  const action=el.hasAttribute('data-do')||el.hasAttribute('data-a');
  const go=()=>{if(tipGo(el)){el.classList.add('hold');if(navigator.vibrate)try{navigator.vibrate(12)}catch(_){}}};
  if(action)tipTimer=setTimeout(go,330);else go();
});
const release=e=>{
  clearTimeout(tipTimer);
  const el=pressEl;pressEl=null;if(!el)return;
  el.classList.remove('hold');
  const action=el.hasAttribute('data-do')||el.hasAttribute('data-a');
  const wasTip=!pressMouse&&tipShown;
  if(wasTip){setTimeout(hideTip,action?0:900);if(el.hasAttribute('data-a'))suppressClick=true}
  if(e.type==='pointerup'&&!wasTip&&el.hasAttribute('data-do')&&!el.classList.contains('dis')){
    const r=el.getBoundingClientRect();
    if(e.clientX>=r.left-6&&e.clientX<=r.right+6&&e.clientY>=r.top-6&&e.clientY<=r.bottom+6){if(pressMouse){hideTip();hoverEl=null}onDo(el.dataset.do,el)}
  }
};
let suppressClick=false;

function onDo(what,el){

function floatText(u,txt,col,cls=''){

function shakeEl(el,big){

async function lunge(u){
  const p=pos(u),dir=u===B.p?1:-1;

}
async function projectile(src,tgt,a){
  const s=pos(src),t=pos(tgt),e=document.createElement('div');
  e.className='proj';e.textContent=a.ic;e.style.setProperty('--c',SCH[a.s][1]);e.style.left=s.x+'px';e.style.top=s.y+'px';UI.fx.appendChild(e);

  await sleep(330);e.remove();
}
function aura(u,a,good){
  const p=pos(u),e=document.createElement('div');
  e.className='proj';e.textContent=a.ic;e.style.setProperty('--c',good?'#ffd100':'#ff5a4d');e.style.left=p.x+'px';e.style.top=p.y+'px';e.style.fontSize='40px';UI.fx.appendChild(e);
  e.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:0},{transform:'translate(-50%,-80%) scale(1.3)',opacity:1,offset:.4},{transform:'translate(-50%,-140%) scale(1)',opacity:0}],{duration:800}).onfinish=()=>e.remove();
}
function setLog(m){if(UI.log)UI.log.textContent=m}
async function play(evs,token){
  for(const ev of evs){
    if(B.token!==token)return;
    switch(ev.t){
      case 'log':setLog(ev.m);break;
      case 'cast':{
        const a=ev.ab,src=ev.src,tgt=src===B.p?B.e:B.p;
        const dmg=a.fx.some(f=>f.k==='dmg'||f.k==='dot');
        SFX.cast();
        if(a.fx.some(f=>f.k==='dmg')){ if(a.s==='phys'&&a.id!=='schuss'&&a.id!=='zielschuss'&&a.id!=='mehrfach')await lunge(src);else await projectile(src,tgt,a) }
        else if(!dmg)aura(src,a,true);
        else await projectile(src,tgt,a);
        break}
      case 'hit':{
        const t=ev.tgt;
        if(ev.amt<=0&&ev.abs>0){floatText(t,`absorbiert ${ev.abs}`,'#fff','sm')}
        else floatText(t,(ev.crit?'💥 ':'')+ev.amt,ev.dot?SCH[ev.sc]?SCH[ev.sc][1]:'#fff':ev.crit?'#ffd100':(t===B.p?'#ff6a5e':'#fff'),ev.crit?'crit':'');
        if(ev.abs>0&&ev.amt>0)floatText(t,`(${ev.abs} abs.)`,'#bfe6ff','sm');
        shakeEl(pos(t).el,ev.crit);ev.crit?SFX.crit():SFX.hit();
        setHp(t,ev.hp);refreshUnit(t);
        await sleep(ev.dot?300:330);break}
      case 'miss':floatText(ev.tgt,'Ausgewichen!','#c8e8ff','sm');SFX.miss();await sleep(300);break;
      case 'heal':if(ev.amt>0){floatText(ev.tgt,'+'+ev.amt,'#5fe07a');SFX.heal();setHp(ev.tgt,ev.hp);aura(ev.tgt,{ic:'✨'},true);await sleep(380)}break;
      case 'st':floatText(ev.tgt,ev.n,ev.good?'#ffd100':'#ff9a8c','sm');if(ev.n==='Betäubt!')SFX.stun();await sleep(160);break;
      case 'sync':refreshAll();renderOrder();break;
      case 'end':{
        const l=ev.winner===B.p?B.e:B.p;
        (l===B.p?UI.up:UI.ue).classList.add('dead');await sleep(500);break}
    }
  }
}

/* ----- Kampfschleife ----- */
async function battleLoop(token){
  await sleep(700);
  while(B&&B.token===token&&!B.over){
    const u=nextUnit(B);
    UI.up.classList.toggle('act',u===B.p);UI.ue.classList.toggle('act',u===B.e);
    await play(beginTurn(B,u),token);
    if(B.token!==token)return;
    if(B.over)break;
    if(isStunned(u)){
      setLog(`${u.name} ist betäubt und setzt aus!`);floatText(u,'💫 Betäubt','#ffd100','sm');await sleep(900);
      await play(endTurn(B,u),token);continue;
    }
    let act;
    if(u===B.p){
      B.waiting=true;renderActs();setLog('Du bist am Zug – wähle ein Symbol.');
      act=await new Promise(r=>{B.resolve=r});
      B.waiting=false;B.resolve=null;renderActs();
      if(B.token!==token)return;
    }else{
      await sleep(550);act=aiPick(B,u);
    }
    await play(perform(B,u,act),token);
    if(B.token!==token)return;
    if(B.over)break;
    await play(endTurn(B,u),token);
    await sleep(240);
  }
  if(B&&B.token===token&&B.over){await sleep(500);result(B.winner===B.p)}
}

let LOOT=null,LOOTBAG=false;
function lootOpen(){

const eqBtn=(it,eq)=>it&&!eq&&!it.sold?`<button class="btn dark" id="eqbtn" data-a="eqnow:${it.id}">Jetzt anlegen</button>`:'';
const backAct=()=>ENC&&ENC.raid!=null?'map':'zone:'+(ENC?ENC.z:0);

function result(win){
  const E=ENC,run=E.run,foe=B.e;let html;
  const potUsed=B.potFree+B.potExtra-B.p.potions,potLeft=Math.max(0,B.potFree-potUsed);
  S.pots=Math.max(0,(S.pots||0)-Math.max(0,potUsed-B.potFree));
  if(win){
    SFX.win();
    S.kills=(S.kills||0)+1;
    const xp=fightXp(foe.lvl,S.lvl,E.kind),lv=applyXp(xp);
    const gold=Math.round((3+foe.lvl*1.5)*XPK[E.kind]*rnd(.8,1.2));S.gold+=gold;
    const LT={hunt:[.3,0],named:[1,1],dtrash:[.35,0],dboss:[1,2],rmini:[.6,2],rboss:[1,3]}[E.kind];
    let it=null,eq=false;
    if(Math.random()<LT[0])it=genItem(foe.lvl,LT[1]);
    LOOT=it;LOOTBAG=false;
    // Questfortschritt
    let qline='';
    if(E.z!=null&&E.raid==null){
      const st=qs(E.z),def=questDef(E.z,st.i);
      if(def&&st.st==='active'){
        const hit=(def.type==='kill'&&E.kind==='hunt'&&E.key===def.mon)||(def.type==='named'&&E.kind==='named')||(def.type==='dungeon'&&E.kind==='dboss');
        if(hit){st.n++;if(st.n>=def.need){st.st='ready';qline=`<div class="qline ok">❓ „${def.t}“ erfüllt – kehre zu ${WORLD[E.z].npc.n} zurück!</div>`}
          else qline=`<div class="qline">📜 ${def.t}: ${st.n} / ${def.need}</div>`}
      }
    }
    // Dungeon / Raid
    let next='',fin='';
    if(run){
      if(run.step<run.list.length-1){
        run.hp=Math.min(1,B.p.hp/B.p.hpMax+.35);run.potions=potLeft;run.step++;
        next=`<button class="btn prime" data-a="next">Nächster Gegner (${run.step+1}/${run.list.length})</button>`;
        fin=`<div class="qline">Du erholst dich etwas (+35 % Leben). Tränke übrig: ${run.potions}</div>`;
      }else{
        const k=run.type+(run.type==='d'?E.z:E.raid);S.done[k]=(S.done[k]||0)+1;
        fin=`<div class="qline ok">🏆 ${esc(run.name)} abgeschlossen!</div>`;
      }
    }
    save();
    html=`<div class="ovl"><div class="bnr win"><span>SIEG!</span></div>
      <div class="box scb ink">${rewardHTML(xp,lv,null,false,gold)}${qline}${fin}${it?`<div class="qline" id="loothint">🎁 ${esc(foe.name)} hat etwas fallen lassen!</div><div id="lootbox" style="width:100%;display:flex;flex-direction:column;gap:8px;align-items:center"></div>`:''}</div>
      ${it?`<button class="btn prime lootbtn" id="lootbtn" data-a="loot">🎁 Beute</button>`:''}
      <div id="after" style="width:100%;display:${it?'none':'flex'};flex-direction:column;gap:12px">${next||`<button class="btn prime" data-a="${backAct()}">Weiter</button>${E.kind==='hunt'?'<button class="btn dark" data-a="retry">Nochmal jagen</button>':''}`}</div></div>`;
  }else{
    SFX.lose();
    if(run){run.step=0;run.hp=1;run.potions=run.type==='d'?3:4}
    html=`<div class="ovl"><div class="bnr lose"><span>NIEDERLAGE</span></div><div class="box scb ink"><div>${esc(foe.name)} war zu stark.</div><div class="mut">${run?'Der Lauf beginnt von vorn. ':''}Tipp: Achte auf Schwächen, Abklingzeiten und nutze deinen Heiltrank.</div></div>
      <button class="btn" data-a="retry">Erneut versuchen</button><button class="btn dark" data-a="${backAct()}">Zurück</button></div>`;
  }
  document.querySelector('.scr').insertAdjacentHTML('beforeend',html);
}

      ${shopStock().map(it=>itemRow(it,`<button class="ib" data-a="buy:${it.id}" ${S.gold<buyPrice(it)?'disabled':''}>${buyPrice(it)} 🪙</button>`,cmp(it))).join('')||'<div class="hint">Ausverkauft. Neue Ware gibt es mit deiner nächsten Stufe.</div>'}
      <div class="sec">Tauschen · Magiestaub</div>
      ${TRADE.map(t=>`<div class="irow"><span class="ico" style="--sc:#b98cff;--is:50px"><span class="g">${t.ic}</span></span><div class="ii"><b>${t.n}</b><small>${t.d}</small></div><div class="bt2">${t.rar?['w','a','t'].map(sl=>`<button class="ib sm" data-a="trade:${t.id}:${sl}" ${S.dust<t.cost?'disabled':''}>${SLOTN[sl]}</button>`).join(''):`<button class="ib" data-a="trade:${t.id}" ${S.dust<t.cost?'disabled':''}>Tauschen</button>`}<small class="cost">${t.cost} ✨</small></div></div>`).join('')}
      <div class="sec">Verkaufen · Rucksack (${bag.length}/${bagCap()})</div>
      ${bag.length?bag.map(it=>itemRow(it,`<button class="ib" data-a="sell:${it.id}">+${sellPrice(it)} 🪙</button>`)).join(''):'<div class="hint">Dein Rucksack ist leer. Angelegte Teile kannst du nicht verkaufen.</div>'}`;
  }else{
    const end=S.lvl>=LEG_LVL;
    body=`<div class="panel qbox"><div class="npc"><span class="ico" style="--is:56px;--sc:#c9a227"><span class="g">🧔</span></span><div><b>Schmied Thargas</b><small>„Was du nicht trägst, schmelze ich ein.“</small></div></div></div>
      <div class="sec">Legendäre Ausrüstung</div>
      <div class="panel infobox">${end?`Für <b>${LEG_COST} 💠 Titanensplitter</b> schmiede ich dir ein <b class="r4t">legendäres</b> Teil deiner Stufe.`:`<b>Erst im Endgame:</b> Komm wieder, wenn du Stufe ${LEG_LVL} erreicht hast.`} Titanensplitter gibt es nur beim Zerlegen <b class="r3t">epischer</b> Ausrüstung.
        <div class="legrow">${['w','a','t'].map(sl=>{const pv={slot:sl,rar:4,v:itemVal(S.lvl,4)};return`<button class="btn ${end&&S.shard>=LEG_COST?'prime':''}" data-a="forge:${sl}" ${end&&S.shard>=LEG_COST?'':'disabled'}><span class="r4t" style="display:block;font-size:13px">${SLOTN[sl]}</span><small style="font:600 10px var(--body);display:block">${itemText(pv)[0]}</small></button>`}).join('')}</div>
        <div class="hint">Du hast ${S.shard} / ${LEG_COST} 💠</div></div>
      <div class="sec">Zerlegen · Rucksack (${bag.length}/${bagCap()})</div>
      ${bag.length?bag.map(it=>itemRow(it,`<button class="ib" data-a="scrap:${it.id}">${it.rar===4?'+3 💠':`+${DUST[it.rar]} ✨${it.rar===3?' +1 💠':''}`}</button>`)).join(''):'<div class="hint">Dein Rucksack ist leer. Angelegte Teile kannst du nicht zerlegen.</div>'}`;
  }
  const sc=document.querySelector('.scroll'),y=sc&&document.querySelector('.town')?sc.scrollTop:0;
  mount(`<div class="scr town"><div class="top"><button class="ib" data-a="map">‹</button><h2>${TOWN.n}</h2><button class="ib" data-a="camp">👤</button></div>
    <div style="padding:0 14px;display:flex;flex-direction:column;gap:8px">${resBar()}<div class="tabs"><button class="btn ${tab==='h'?'':'dark'}" data-a="town:h">Händler</button><button class="btn ${tab==='s'?'':'dark'}" data-a="town:s">Schmied</button></div>
    ${TMSG?`<div class="tmsg">${TMSG}</div>`:''}</div>
    <div class="scroll">${body}</div></div>`,'lite');
  TMSG='';if(y)document.querySelector('.scroll').scrollTop=y;
}
let TT='h';
function townAct(k,v,a){
  const find=id=>S.bag.find(x=>x.id===id);
  if(k==='buycap'){const p=capPrice();if(S.gold<p||bagCap()>=CAP_MAX)return;S.gold-=p;S.cap=bagCap()+5;TMSG=`🎒 Rucksack erweitert: jetzt ${S.cap} Plätze.`}
  else if(k==='buypot'){const p=potPrice();if(S.gold<p)return;S.gold-=p;S.pots++;TMSG='🧪 Heiltrank gekauft.'}
  else if(k==='buy'){const it=shopStock().find(x=>x.id===v);if(!it||S.gold<buyPrice(it))return;if(S.eq[it.slot]&&bagFull()){TMSG='<span class="dn">🎒 Rucksack voll – erst Platz schaffen.</span>';return townScreen(TT)}S.gold-=buyPrice(it);S.shop.items=S.shop.items.filter(x=>x!==it);const eq=giveItem(it);TMSG=`Gekauft: <b class="r${it.rar}t">${esc(it.name)}</b>${eq?' (angelegt)':' (im Rucksack)'}`}
  else if(k==='sell'){const it=find(v);if(!it)return;S.bag=S.bag.filter(x=>x!==it);S.gold+=sellPrice(it);TMSG=`Verkauft für ${sellPrice(it)} 🪙.`}
  else if(k==='scrap'){const it=find(v);if(!it)return;S.bag=S.bag.filter(x=>x!==it);
    if(it.rar===4){S.shard+=3;TMSG='Zerlegt: +3 💠 Titanensplitter.'}else{S.dust+=DUST[it.rar];if(it.rar===3)S.shard++;TMSG=`Zerlegt: +${DUST[it.rar]} ✨ Magiestaub${it.rar===3?' und +1 💠 Titanensplitter':''}.`}}
  else if(k==='trade'){const t=TRADE.find(x=>x.id===v);if(!t||S.dust<t.cost)return;if(t.rar&&S.eq[a.split(':')[2]]&&bagFull()){TMSG='<span class="dn">🎒 Rucksack voll – erst Platz schaffen.</span>';return townScreen(TT)}S.dust-=t.cost;
    if(t.id==='pot'){S.pots++;TMSG='🧪 Heiltrank eingetauscht.'}else{const it=genItem(S.lvl,t.rar,a.split(':')[2]);const eq=giveItem(it);TMSG=`Erhalten: <b class="r${it.rar}t">${esc(it.name)}</b>${eq?' (angelegt)':' (im Rucksack)'}`}}
  else if(k==='forge'){if(S.lvl<LEG_LVL||S.shard<LEG_COST)return;if(S.eq[v]&&bagFull()){TMSG='<span class="dn">🎒 Rucksack voll – dein altes Teil braucht einen Platz.</span>';return townScreen(TT)}S.shard-=LEG_COST;const it=genLegend(v),old=S.eq[v];S.eq[v]=it;if(old)S.bag.push(old);SFX.win();TMSG=`Geschmiedet und angelegt: <b class="r4t">${esc(it.name)}</b>${old?' · dein altes Teil liegt im Rucksack':''}`}
  save();SFX.heal();townScreen(TT);
}
function questLog(){
  const rows=WORLD.map((W,z)=>{const st=qs(z),def=questDef(z,st.i);
    if(S.lvl<ZREQ[z])return'';
    if(!def)return`<div class="mrow"><div class="mi"><b>${ZONES[z].n}</b><small>✔ Alle Quests erfüllt</small></div></div>`;
    return`<button class="mrow" data-a="go2:z${z}"><div class="mi"><b>${st.st==='new'?'❗':st.st==='ready'?'❓':'📜'} ${def.t}</b><small>${ZONES[z].n} · ${W.npc.n}</small><small>${st.st==='new'?'Noch nicht angenommen':st.st==='ready'?'Bereit zur Abgabe':`${def.goal}: ${st.n} / ${def.need}`}</small></div><span class="go">›</span></button>`}).join('');
  mount(`<div class="scr"><div class="top"><button class="ib" data-a="map">‹</button><h2>Questlog</h2></div><div class="scroll">${rows}<div class="hint">❗ neue Quest · 📜 läuft · ❓ bereit zur Abgabe</div></div></div>`,'lite');
}
function questFinish(z){
  const st=qs(z),def=questDef(z,st.i);if(!def||st.st!=='ready'||bagFull())return;
  const qg=15+def.lvl*5;S.gold+=qg;
  const lv=applyXp(def.xp),it=genItem(Math.max(def.lvl,S.lvl-1),def.rar,def.slot),eq=giveItem(it);
  st.i++;st.st='new';st.n=0;save();SFX.win();
  document.querySelector('.scr').insertAdjacentHTML('beforeend',`<div class="ovl"><div class="bnr win"><span style="font-size:clamp(14px,4.4vw,18px);white-space:nowrap">QUEST ERFÜLLT</span></div>
    <div class="box scb ink"><div class="new" style="font-size:15px">${def.t}</div>${rewardHTML(def.xp,lv,it,eq,qg)}</div>${eqBtn(it,eq)}<button class="btn prime" data-a="zone:${z}">Weiter</button></div>`);
}

/* ================================================================
   AKTIONEN
================================================================ */
function onAct(a,el){
  const [k,v]=a.split(':');
  switch(k){
    case 'snd':soundOn=!soundOn;try{localStorage.setItem(KEY+'_snd',soundOn?'1':'0')}catch(e){}
      music(MUS.want);document.querySelectorAll('[data-a="snd"]').forEach(b=>b.textContent=b.classList.contains('btn')?(soundOn?'🔊 Ton an':'🔇 Ton aus'):(soundOn?'🔊':'🔇'));break;
    case 'new':CR={step:0,race:null,cls:null,name:''};creation();break;
    case 'cont':S=load();worldMap();break;
    case 'race':CR.race=v;if(CR.cls&&!RACES[v].cls.includes(CR.cls))CR.cls=null;crHero();creation();break;
    case 'cls':CR.cls=v;crHero();creation();break;
    case 'cback':if(CR.step===0){S=load();title()}else{CR.step--;crHero();creation()}break;
    case 'cnext':{
      if(CR.step<2){CR.step++;crHero();creation();break}
      const nm=($$('nm').value||'').trim()||'Held';
      S={name:nm,race:CR.race,cls:CR.cls,lvl:1,xp:0,eq:{},bag:[],q:{},done:{},loc:'z0',gold:0,dust:0,shard:0,pots:0};save();worldMap();break}
    case 'slot':gear(v);break;
    case 'equip':if(equipItem(v)){SFX.heal();gear(GS)}break;
    case 'drop':S.bag=S.bag.filter(x=>x.id!==v);save();gear(GS);break;
    case 'loot':lootOpen();break;
    case 'loottake':lootDone('take');break;
    case 'lootbag':LOOTBAG=!LOOTBAG;lootOpen();break;
    case 'lootdrop':S.bag=S.bag.filter(x=>x.id!==v);save();SFX.miss();lootOpen();break;
    case 'lootleave':lootDone('leave');break;
    case 'eqnow':if(equipItem(v)){SFX.heal();const n=$$('eqnote');if(n){n.className='new';n.textContent='✔ Angelegt'}const b=$$('eqbtn');if(b)b.style.display='none'}break;
    case 'retry':case 'next':startBattle();break;
    case 'camp':B=null;camp();break;
    case 'map':worldMap();break;
    case 'town':townScreen(v);break;
    case 'buycap':case 'buypot':case 'buy':case 'sell':case 'scrap':case 'trade':case 'forge':townAct(k,v,a);break;
    case 'qlog':questLog();break;
    case 'go':travel(v);break;
    case 'go2':S.loc=v;save();zoneScreen(+v.slice(1));break;
    case 'zone':zoneScreen(+v);break;
    case 'qacc':{const st=qs(+v);st.st='active';st.n=0;save();zoneScreen(+v);break}
    case 'qfin':questFinish(+v);break;
    case 'hunt':{const z=+v,i=+a.split(':')[2],key=ZONES[z].mon[i];ENC={kind:'hunt',z,zone:z,key,make:()=>mkMon(MONS[key],ZL[z]+i)};startBattle();break}
    case 'named':{const z=+v;ENC={kind:'named',z,zone:z,make:()=>namedFoe(z,RACES[S.race].f)};startBattle();break}
    case 'dungeon':{const z=+v;ENC={z,zone:z,run:{type:'d',name:WORLD[z].dg.n,step:0,list:dungeonList(z),hp:1,potions:3}};startBattle();break}
    case 'raid':{const r=+v;ENC={raid:r,zone:RAIDS[r].zone,run:{type:'r',name:RAIDS[r].n,step:0,list:raidList(r),hp:1,potions:4}};startBattle();break}
    case 'flee':{
      if(!B)break;
      if(document.querySelector('.ovl'))break;
      B.token=null;onAct(backAct());break}
    case 'menu':{
      title();break}
  }
}
document.addEventListener('input',e=>{if(e.target.id==='nm')CR.name=e.target.value});

/* ================================================================
   START
================================================================ */
if(typeof window!=='undefined'&&document.getElementById('app')){
  S=load();title();
}
</script>
</body>
</html>
